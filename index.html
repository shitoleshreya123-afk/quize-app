<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Document</title>
</head>
<body>
    <div id="quiz-container">
       
        <h1>Hello</h1>

        <p>Enter your name to conitnue the quiz</p>
        <form onsubmit="getName(event)">
            <label for="name">Enter your Name:
                <input type="text" id="name-input" required>
            </label>
            <input type="submit" value="Enter">
        </form>
        <div id="message"></div>
        <div>
            <h2>Select your category</h2>
            <button onclick="startQuiz(event)" value="HTML">HTML</button>
            <button onclick="startQuiz(event)" value="CSS">CSS</button>
            <button onclick="startQuiz(event)" value="react.js">react.js</button>
            <button onclick="startQuiz(event)" value="javascript">javascript</button>
        </div>

    </div>
    <script src="./script.js"></script>
</body>
</html>
